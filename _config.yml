title: zurdo
description: Documentation for the zurdo CLI
url: "https://zurdo.sh"
baseurl: ""
logo: /doks-theme/assets/images/layout/logo.png

# Social share card (og:image / twitter:image) for every page, via jekyll-seo-tag.
# A page can override it with its own `image:` front matter.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /doks-theme/assets/images/social-card.png
        width: 1200
        height: 630

# --- zurdo site settings (header, footer, and version badge on every page) ---
zurdo:
    version: v1.25.0 # the released zurdo version these docs describe
    repo: https://github.com/NumeronAI/zurdo.github.io
    license: Zurdo is proprietary software, distributed as pre-built binaries. It is an independent reimplementation inspired by the Ralph technique.
    copyright: Copyright © 2026 Numeron Technologies Inc.
    nav: # top navigation, shown in the header and footer of every page
        - title: How it works
          url: /docs/how-it-works.html
        - title: Installation
          url: /docs/installation.html
        - title: Tutorial
          url: /docs/tutorial.html
        - title: Usage
          url: /docs/usage.html
        - title: Writing PRDs
          url: /docs/writing-prds.html
        - title: Commands
          url: /docs/commands.html
        - title: Carol
          url: /carol/
    support:
        - label: Report a zurdo bug or request a feature
          url: https://github.com/ElOrlis/zurdo-dist/issues
        - label: Report a Carol bug or request a feature
          url: https://github.com/ElOrlis/carol-dist/issues
        - label: Give documentation feedback
          url: https://github.com/NumeronAI/zurdo.github.io/issues

# --- Carol, zurdo's project-management companion (pages under /carol/) ---
carol:
    version: v0.1.2 # the released Carol version the /carol/ pages describe
    dist: https://github.com/ElOrlis/carol-dist

# Jekyll settings
layouts_dir: ./doks-theme/_layouts
includes_dir: ./doks-theme/_includes
markdown: kramdown

plugins:
  - jekyll-seo-tag
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - mise.toml
  - vendor/
  - .claude/
  - .agents/
  - skills-lock.json
